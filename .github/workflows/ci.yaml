name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ===============================
  # JOB 1 - BUILD
  # ===============================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: echo "Static HTML project - nothing to build"


  # ===============================
  # JOB 2 - SCAN TRIVY
  # ===============================
  scan-trivy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          severity: CRITICAL,HIGH


  # ===============================
  # JOB 3 - DEPLOY
  # ===============================
  deploy:
    runs-on: ubuntu-latest
    needs: scan-trivy

    steps:
      - name: Deploy project
        run: echo "Deploy simulation"